<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>公仔頭盔 Filter Demo</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin: 16px 0 8px; font-size: 1.4rem; }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #e87734;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button.active { background: #c45a1a; }
    button:hover { opacity: 0.9; }
    #container {
      position: relative;
      width: 640px;
      max-width: 95vw;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* mirror */
    }
    #overlay {
      pointer-events: none;
    }
    .hint {
      margin-top: 12px;
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>公仔頭盔 Filter（Web Demo）</h1>
  <div class="controls">
    <button id="btnA" class="active">款式 A（露出臉）</button>
    <button id="btnB">款式 B（戰士頭盔）</button>
  </div>
  <div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="hint">開 webcam 後轉頭試試。有輕微傾斜效果。按上面按鈕切換款式。</div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const btnA = document.getElementById("btnA");
    const btnB = document.getElementById("btnB");

    let currentStyle = "A";
    const imgA = new Image();
    const imgB = new Image();
    imgA.src = "001a.png";
    imgB.src = "001b.png";

    btnA.onclick = () => { currentStyle = "A"; btnA.classList.add("active"); btnB.classList.remove("active"); };
    btnB.onclick = () => { currentStyle = "B"; btnB.classList.add("active"); btnA.classList.remove("active"); };

    async function start() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 } });
      video.srcObject = stream;
      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      const faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: true
      });

      function loop() {
        if (video.readyState >= 2) {
          const results = faceLandmarker.detectForVideo(video, performance.now());
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (results.faceLandmarks && results.faceLandmarks.length > 0) {
            const landmarks = results.faceLandmarks[0];
            const matrix = results.facialTransformationMatrixes?.[0];

            const forehead = landmarks[10];
            const chin = landmarks[152];
            const left = landmarks[234];
            const right = landmarks[454];

            const cx = (left.x + right.x) / 2 * canvas.width;
            const cy = (forehead.y + chin.y) / 2 * canvas.height;
            const faceWidth = Math.abs(right.x - left.x) * canvas.width;
            const faceHeight = Math.abs(chin.y - forehead.y) * canvas.height;
            const size = Math.max(faceWidth, faceHeight) * 2.2;

            let rotY = 0;
            let rotX = 0;
            if (matrix) {
              rotY = Math.atan2(matrix.data[8], matrix.data[0]) * 0.6;
              rotX = Math.atan2(-matrix.data[9], matrix.data[5]) * 0.4;
            } else {
              rotY = (right.x - left.x - 0.3) * 0.8;
              rotX = (forehead.y - 0.3) * 0.5;
            }

            const img = currentStyle === "A" ? imgA : imgB;
            if (img.complete) {
              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate(rotY * 0.3);
              ctx.transform(1, rotX * 0.15, 0, 1, 0, 0);
              ctx.drawImage(img, -size / 2, -size / 2, size, size);
              ctx.restore();
            }
          }
        }
        requestAnimationFrame(loop);
      }
      loop();
    }

    start().catch(err => {
      document.body.insertAdjacentHTML("beforeend", `<p style="color:#f66">無法開啟 webcam：${err.message}</p>`);
    });
  </script>
</body>
</html>
