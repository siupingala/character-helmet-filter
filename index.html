<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>公仔頭盔 Filter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f1a12;
      color: #f5f5f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    h1 { margin: 8px 0 4px; font-size: 1.3rem; font-weight: 600; text-align: center; }
    .subtitle { font-size: 0.85rem; opacity: 0.7; margin-bottom: 16px; text-align: center; }
    .controls { display: flex; gap: 10px; margin-bottom: 16px; width: 100%; max-width: 420px; }
    button {
      flex: 1; padding: 12px 8px; border: none; border-radius: 12px;
      background: #2d4a32; color: #e8f0e8; font-size: 0.95rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    button.active { background: #e87734; color: white; }
    button:active { transform: scale(0.97); }
    .frame-wrap {
      position: relative; width: 100%; max-width: 420px; aspect-ratio: 3 / 4;
      border-radius: 24px; overflow: hidden; background: #000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    video, #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    #overlay { pointer-events: none; }
    .plant-frame {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background: url("leaf-frame.png") center / cover no-repeat;
    }
    .hint { margin-top: 14px; font-size: 0.8rem; opacity: 0.6; text-align: center; max-width: 360px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>公仔頭盔 Filter</h1>
  <div class="subtitle">轉頭試試 · 可切換款式</div>
  <div class="controls">
    <button id="btnA" class="active">款式 A<br><small>露出臉</small></button>
    <button id="btnB">款式 B<br><small>戰士頭盔</small></button>
  </div>
  <div class="frame-wrap">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="plant-frame"></div>
  </div>
  <div class="hint">開 webcam 後轉頭。綠葉 frame 會包圍鏡頭。<br>建議用手機直向玩。</div>
  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const btnA = document.getElementById("btnA");
    const btnB = document.getElementById("btnB");
    let currentStyle = "A";
    const imgA = new Image(); const imgB = new Image();
    imgA.src = "001a.png"; imgB.src = "001b.png";
    btnA.onclick = () => { currentStyle = "A"; btnA.classList.add("active"); btnB.classList.remove("active"); };
    btnB.onclick = () => { currentStyle = "B"; btnB.classList.add("active"); btnA.classList.remove("active"); };
    async function start() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } }, audio: false
      });
      video.srcObject = stream; await video.play();
      function resize() { canvas.width = video.videoWidth || 720; canvas.height = video.videoHeight || 960; }
      resize(); video.addEventListener("loadedmetadata", resize);
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      const faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: false, outputFacialTransformationMatrixes: true
      });
      function loop() {
        if (video.readyState >= 2) {
          const results = faceLandmarker.detectForVideo(video, performance.now());
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (results.faceLandmarks && results.faceLandmarks.length > 0) {
            const landmarks = results.faceLandmarks[0];
            const matrix = results.facialTransformationMatrixes?.[0];
            const forehead = landmarks[10], chin = landmarks[152], left = landmarks[234], right = landmarks[454];
            const cx = (left.x + right.x) / 2 * canvas.width;
            const cy = (forehead.y + chin.y) / 2 * canvas.height;
            const faceWidth = Math.abs(right.x - left.x) * canvas.width;
            const faceHeight = Math.abs(chin.y - forehead.y) * canvas.height;
            const size = Math.max(faceWidth, faceHeight) * 2.4;
            let rotY = 0, rotX = 0;
            if (matrix) {
              rotY = Math.atan2(matrix.data[8], matrix.data[0]) * 0.55;
              rotX = Math.atan2(-matrix.data[9], matrix.data[5]) * 0.35;
            } else {
              rotY = (right.x - left.x - 0.28) * 0.7;
              rotX = (forehead.y - 0.28) * 0.45;
            }
            const img = currentStyle === "A" ? imgA : imgB;
            if (img.complete && img.naturalWidth) {
              ctx.save(); ctx.translate(cx, cy); ctx.rotate(rotY * 0.28);
              ctx.transform(1, rotX * 0.12, 0, 1, 0, 0);
              ctx.drawImage(img, -size / 2, -size / 2, size, size); ctx.restore();
            }
          }
        }
        requestAnimationFrame(loop);
      }
      loop();
    }
    start().catch(err => {
      document.body.insertAdjacentHTML("beforeend", `<p style="color:#f88; margin-top:16px; text-align:center;">無法開啟鏡頭：${err.message}</p>`);
    });
  </script>
</body>
</html>
